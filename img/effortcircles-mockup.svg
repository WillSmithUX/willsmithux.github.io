<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Three phone screens showing EffortCircles: writing a journal entry, choosing between Inner and Outer Circle, and the Inner Circle feed.">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f7f7f5"/>
      <stop offset="100%" stop-color="#e5e8e3"/>
    </linearGradient>
    <filter id="shadowE" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#14181a" flood-opacity="0.22"/>
    </filter>
    <style>
      .ui   { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
      .mn   { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; }
      .ttl  { font-size: 15.5px; fill: #14181a; font-weight: 600; }
      .sub  { font-size: 10.5px; fill: #8f979b; letter-spacing: 1.1px; }
      .time { font-size: 12.5px; fill: #8f979b; font-weight: 600; }
      .h2   { font-size: 17px; fill: #14181a; font-weight: 600; }
      .body { font-size: 14px; fill: #333a3d; }
      .meta { font-size: 12px; fill: #8f979b; }
      .lab  { font-size: 10.5px; fill: #7e858a; letter-spacing: 1.4px; }
      .chip { font-size: 13px; fill: #2c4429; font-weight: 500; }
      .chipOff { font-size: 13px; fill: #7e858a; font-weight: 500; }
      .btnP { font-size: 14.5px; fill: #fdfdfc; font-weight: 600; }
      .btnS { font-size: 14.5px; fill: #2c4429; font-weight: 600; }
      .card { font-size: 15.5px; fill: #14181a; font-weight: 600; }
      .tabOn  { font-size: 10.5px; fill: #2c4429; }
      .tabOff { font-size: 10.5px; fill: #a2a8ab; }
      .name { font-size: 13.5px; fill: #14181a; font-weight: 600; }
      .av   { font-size: 12px; fill: #fdfdfc; font-weight: 600; }
      .hint { font-size: 11.5px; fill: #949b9f; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgE)"/>

  <!-- ============ PHONE 1 - JOURNAL ENTRY ============ -->
  <g class="ui">
    <rect x="80" y="95" width="400" height="810" rx="48" fill="#14181a" filter="url(#shadowE)"/>
    <rect x="94" y="109" width="372" height="782" rx="36" fill="#fdfdfc"/>

    <text class="time" x="116" y="152">7:12</text>
    <rect x="410" y="143" width="16" height="9" rx="2" fill="#cacbc4"/>
    <rect x="432" y="140" width="12" height="12" rx="2" fill="#cacbc4"/>
    <line x1="94" y1="176" x2="466" y2="176" stroke="#e1e2dc" stroke-width="1"/>

    <text class="ttl" x="116" y="206">EffortCircles</text>
    <text class="mn sub" x="116" y="226">JOURNAL</text>
    <line x1="94" y1="246" x2="466" y2="246" stroke="#e1e2dc" stroke-width="1"/>

    <text class="h2" x="116" y="288">Today&#8217;s entry</text>
    <text class="meta" x="116" y="310">Tuesday · 7:12 AM</text>

    <rect x="116" y="330" width="328" height="146" rx="16" fill="#f2f3ef" stroke="#e1e2dc"/>
    <text class="body" x="136" y="362">Ran three miles before work.</text>
    <text class="body" x="136" y="384">Legs felt heavy the whole way</text>
    <text class="body" x="136" y="406">but I finished it out. Glad I</text>
    <text class="body" x="136" y="428">got out the door at all.</text>

    <text class="mn lab" x="116" y="512">ENERGY</text>
    <rect x="116" y="526" width="98" height="36" rx="18" fill="#41613f" fill-opacity="0.05" stroke="#cdd1c9"/>
    <text class="chipOff" x="165" y="549" text-anchor="middle">Low</text>
    <rect x="224" y="526" width="98" height="36" rx="18" fill="#41613f" fill-opacity="0.14" stroke="#41613f" stroke-opacity="0.6"/>
    <text class="chip" x="273" y="549" text-anchor="middle">Steady</text>
    <rect x="332" y="526" width="98" height="36" rx="18" fill="#41613f" fill-opacity="0.05" stroke="#cdd1c9"/>
    <text class="chipOff" x="381" y="549" text-anchor="middle">Strong</text>

    <text class="mn lab" x="116" y="602">STRESS</text>
    <rect x="116" y="616" width="98" height="36" rx="18" fill="#41613f" fill-opacity="0.14" stroke="#41613f" stroke-opacity="0.6"/>
    <text class="chip" x="165" y="639" text-anchor="middle">Calm</text>
    <rect x="224" y="616" width="98" height="36" rx="18" fill="#41613f" fill-opacity="0.05" stroke="#cdd1c9"/>
    <text class="chipOff" x="273" y="639" text-anchor="middle">Tense</text>

    <rect x="116" y="722" width="328" height="50" rx="25" fill="#41613f"/>
    <text class="btnP" x="280" y="753" text-anchor="middle">Continue</text>

    <line x1="94" y1="820" x2="466" y2="820" stroke="#e1e2dc" stroke-width="1"/>
    <circle cx="156" cy="838" r="3" fill="#41613f"/>
    <text class="mn tabOn"  x="156" y="864" text-anchor="middle">Journal</text>
    <text class="mn tabOff" x="280" y="864" text-anchor="middle">Reflections</text>
    <text class="mn tabOff" x="404" y="864" text-anchor="middle">Circles</text>

    <text class="mn lab" x="280" y="952" text-anchor="middle" fill="#5f676b">01 · WRITE, WITH FEELING</text>
  </g>

  <!-- ============ PHONE 2 - PRIVACY CHOICE ============ -->
  <g class="ui">
    <rect x="600" y="95" width="400" height="810" rx="48" fill="#14181a" filter="url(#shadowE)"/>
    <rect x="614" y="109" width="372" height="782" rx="36" fill="#fdfdfc"/>

    <text class="time" x="636" y="152">7:14</text>
    <rect x="930" y="143" width="16" height="9" rx="2" fill="#cacbc4"/>
    <rect x="952" y="140" width="12" height="12" rx="2" fill="#cacbc4"/>
    <line x1="614" y1="176" x2="986" y2="176" stroke="#e1e2dc" stroke-width="1"/>

    <text class="ttl" x="636" y="206">EffortCircles</text>
    <text class="mn sub" x="636" y="226">WHO SEES THIS?</text>
    <line x1="614" y1="246" x2="986" y2="246" stroke="#e1e2dc" stroke-width="1"/>

    <rect x="636" y="282" width="328" height="168" rx="20" fill="#41613f" fill-opacity="0.08" stroke="#41613f" stroke-opacity="0.65" stroke-width="1.5"/>
    <circle cx="672" cy="322" r="15" fill="#41613f"/>
    <text class="av" x="672" y="327" text-anchor="middle">M</text>
    <circle cx="698" cy="322" r="15" fill="#6a8465" stroke="#fdfdfc" stroke-width="2"/>
    <text class="av" x="698" y="327" text-anchor="middle">D</text>
    <circle cx="724" cy="322" r="15" fill="#93a88e" stroke="#fdfdfc" stroke-width="2"/>
    <text class="av" x="724" y="327" text-anchor="middle">R</text>
    <circle cx="750" cy="322" r="15" fill="#e0e4dd" stroke="#fdfdfc" stroke-width="2"/>
    <text class="av" x="750" y="327" text-anchor="middle" fill="#41613f">+1</text>
    <circle cx="940" cy="322" r="11" fill="#41613f"/>
    <path d="M935 322 L938.5 325.5 L945 318.5" stroke="#fdfdfc" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="card" x="656" y="373">Inner Circle</text>
    <text class="meta" x="656" y="396">4 people you chose</text>
    <line x1="656" y1="410" x2="944" y2="410" stroke="#c8d0c5" stroke-width="1"/>
    <text class="body" x="656" y="434" font-size="13">Honest sharing. No numbers, no ranking.</text>

    <rect x="636" y="470" width="328" height="146" rx="20" fill="#f2f3ef" stroke="#e1e2dc"/>
    <circle cx="672" cy="510" r="15" fill="#d9ddd6"/>
    <text class="av" x="672" y="515" text-anchor="middle" fill="#7e858a">23</text>
    <text class="card" x="656" y="561">Outer Circle</text>
    <text class="meta" x="656" y="584">Lower-pressure updates</text>

    <rect x="636" y="656" width="328" height="50" rx="25" fill="none" stroke="#41613f" stroke-opacity="0.6" stroke-width="1.5"/>
    <text class="btnS" x="800" y="687" text-anchor="middle">Save privately</text>

    <rect x="636" y="720" width="328" height="50" rx="25" fill="#41613f"/>
    <text class="btnP" x="800" y="751" text-anchor="middle">Post to Inner Circle</text>

    <text class="hint" x="800" y="794" text-anchor="middle">You can change this anytime.</text>

    <line x1="614" y1="820" x2="986" y2="820" stroke="#e1e2dc" stroke-width="1"/>
    <circle cx="676" cy="838" r="3" fill="#41613f"/>
    <text class="mn tabOn"  x="676" y="864" text-anchor="middle">Journal</text>
    <text class="mn tabOff" x="800" y="864" text-anchor="middle">Reflections</text>
    <text class="mn tabOff" x="924" y="864" text-anchor="middle">Circles</text>

    <text class="mn lab" x="800" y="952" text-anchor="middle" fill="#5f676b">02 · A DELIBERATE PRIVACY CHOICE</text>
  </g>

  <!-- ============ PHONE 3 - INNER CIRCLE FEED ============ -->
  <g class="ui">
    <rect x="1120" y="95" width="400" height="810" rx="48" fill="#14181a" filter="url(#shadowE)"/>
    <rect x="1134" y="109" width="372" height="782" rx="36" fill="#fdfdfc"/>

    <text class="time" x="1156" y="152">7:20</text>
    <rect x="1450" y="143" width="16" height="9" rx="2" fill="#cacbc4"/>
    <rect x="1472" y="140" width="12" height="12" rx="2" fill="#cacbc4"/>
    <line x1="1134" y1="176" x2="1506" y2="176" stroke="#e1e2dc" stroke-width="1"/>

    <text class="ttl" x="1156" y="206">Inner Circle</text>
    <text class="mn sub" x="1156" y="226">4 PEOPLE · NO LEADERBOARD</text>
    <line x1="1134" y1="246" x2="1506" y2="246" stroke="#e1e2dc" stroke-width="1"/>

    <rect x="1156" y="282" width="328" height="140" rx="18" fill="#f2f3ef" stroke="#e1e2dc"/>
    <circle cx="1188" cy="316" r="15" fill="#41613f"/>
    <text class="av" x="1188" y="321" text-anchor="middle">M</text>
    <text class="name" x="1214" y="313">Maya</text>
    <text class="meta" x="1214" y="330">this morning</text>
    <text class="body" x="1176" y="364" font-size="13.5">Skipped the gym, walked instead.</text>
    <text class="body" x="1176" y="386" font-size="13.5">Counting it. Energy was low all</text>
    <text class="body" x="1176" y="408" font-size="13.5">week and that&#8217;s okay.</text>

    <rect x="1156" y="438" width="328" height="140" rx="18" fill="#f2f3ef" stroke="#e1e2dc"/>
    <circle cx="1188" cy="472" r="15" fill="#6a8465"/>
    <text class="av" x="1188" y="477" text-anchor="middle">D</text>
    <text class="name" x="1214" y="469">Dev</text>
    <text class="meta" x="1214" y="486">yesterday</text>
    <text class="body" x="1176" y="520" font-size="13.5">Third session this week. Still</text>
    <text class="body" x="1176" y="542" font-size="13.5">not fast, still showing up.</text>
    <text class="meta" x="1176" y="564">Steady energy · Calm</text>

    <rect x="1156" y="594" width="328" height="118" rx="18" fill="#f2f3ef" stroke="#e1e2dc"/>
    <circle cx="1188" cy="628" r="15" fill="#93a88e"/>
    <text class="av" x="1188" y="633" text-anchor="middle">R</text>
    <text class="name" x="1214" y="625">Coach R.</text>
    <text class="meta" x="1214" y="642">2 days ago</text>
    <text class="body" x="1176" y="676" font-size="13.5">Rest day. Deliberately. That is</text>
    <text class="body" x="1176" y="698" font-size="13.5">also the training.</text>

    <line x1="1134" y1="820" x2="1506" y2="820" stroke="#e1e2dc" stroke-width="1"/>
    <text class="mn tabOff" x="1196" y="864" text-anchor="middle">Journal</text>
    <text class="mn tabOff" x="1320" y="864" text-anchor="middle">Reflections</text>
    <circle cx="1444" cy="838" r="3" fill="#41613f"/>
    <text class="mn tabOn"  x="1444" y="864" text-anchor="middle">Circles</text>

    <text class="mn lab" x="1320" y="952" text-anchor="middle" fill="#5f676b">03 · ACCOUNTABILITY WITHOUT AN AUDIENCE</text>
  </g>
</svg>
