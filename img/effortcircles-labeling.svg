<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-label="Diagram of the usability finding: asked to write an entry, three of four participants opened the Journal tab while the action lived under Reflections. The fix moves all writing to Journal and leaves Reflections as the archive.">
  <defs>
    <linearGradient id="lBg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f7f7f5"/><stop offset="100%" stop-color="#e9ece7"/>
    </linearGradient>
    <style>
      .mn  { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; }
      .ui  { font-family: Inter, 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif; }
      .lab { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 11px; letter-spacing: 1.8px; fill: #676f74; }
      .tab { font-size: 17px; font-weight: 600; }
      .det { font-size: 13.5px; fill: #5f676b; }
      .big { font-size: 34px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1600" height="640" fill="url(#lBg)"/>

  <text class="lab" x="80" y="62">WHAT FOUR TESTERS ACTUALLY DID</text>
  <text class="lab" x="880" y="62" fill="#41613f">WHAT CHANGED</text>
  <line x1="80" y1="84" x2="1520" y2="84" stroke="#d3d7d2"/>

  <!-- ============ LEFT: the finding ============ -->
  <g>
    <text class="ui" x="80" y="128" font-size="15" fill="#333a3d">Task given: &#8220;write today&#8217;s entry.&#8221;</text>

    <!-- participants -->
    <g fill="#5f676b">
      <circle cx="250" cy="182" r="13"/><circle cx="292" cy="182" r="13"/>
      <circle cx="334" cy="182" r="13"/><circle cx="430" cy="182" r="13" fill="#a8aea7"/>
    </g>

    <!-- routing -->
    <g stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M250 200 C250 240, 232 250, 232 286" stroke="#41613f" stroke-opacity="0.65"/>
      <path d="M292 200 C292 240, 240 250, 240 286" stroke="#41613f" stroke-opacity="0.65"/>
      <path d="M334 200 C334 240, 248 250, 248 286" stroke="#41613f" stroke-opacity="0.65"/>
      <path d="M430 200 C430 240, 520 250, 520 286" stroke="#a8aea7"/>
    </g>

    <!-- Journal tab (where they went) -->
    <rect x="110" y="292" width="268" height="122" rx="8" fill="#41613f" fill-opacity="0.11" stroke="#41613f" stroke-opacity="0.6" stroke-width="1.6"/>
    <text class="ui tab" x="134" y="330" fill="#2c4429">Journal</text>
    <text class="ui big" x="134" y="386" fill="#41613f">3 of 4</text>
    <text class="mn" x="248" y="386" font-size="11" letter-spacing="1.4" fill="#41613f">WENT HERE</text>

    <!-- Reflections tab (where the action was) -->
    <rect x="402" y="292" width="268" height="122" rx="8" fill="#fdfdfc" stroke="#d8dcdb"/>
    <text class="ui tab" x="426" y="330" fill="#5f676b">Reflections</text>
    <text class="ui big" x="426" y="386" fill="#8b918a">1</text>
    <text class="mn" x="470" y="386" font-size="11" letter-spacing="1.4" fill="#8b918a">THE ACTUAL LOCATION</text>

    <text class="ui det" x="110" y="456">Users had already split the space into writing and reviewing.</text>
    <text class="ui det" x="110" y="480">The label sat on the wrong side of their model.</text>
  </g>

  <!-- ============ RIGHT: the fix ============ -->
  <g>
    <rect x="880" y="128" width="640" height="130" rx="8" fill="#41613f" fill-opacity="0.07" stroke="#41613f" stroke-opacity="0.35"/>
    <g stroke="#41613f" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M918 190 L940 168 L950 178 L928 200 L914 204 Z"/>
    </g>
    <text class="ui tab" x="976" y="178" fill="#2c4429">Journal</text>
    <text class="ui det" x="976" y="208">Every writing action lives here. New entry, energy,</text>
    <text class="ui det" x="976" y="230">stress, and the decision about who sees it.</text>

    <rect x="880" y="282" width="640" height="130" rx="8" fill="#fdfdfc" stroke="#d8dcdb"/>
    <g stroke="#5f676b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M912 344 C924 326, 948 326, 960 344 C948 362, 924 362, 912 344 Z"/>
      <circle cx="936" cy="344" r="6"/>
    </g>
    <text class="ui tab" x="976" y="332" fill="#333a3d">Reflections</text>
    <text class="ui det" x="976" y="362">The archive, which is what people assumed it was.</text>
    <text class="ui det" x="976" y="384">Reading back, never writing.</text>

    <text class="ui det" x="880" y="456">One label moved. Nothing else about the flow changed.</text>
  </g>

  <line x1="80" y1="530" x2="1520" y2="530" stroke="#d3d7d2"/>
  <text class="ui" x="80" y="572" font-size="15" fill="#5f676b">Four sessions caught what was invisible from inside the team&#8217;s own mental model.</text>
</svg>
