<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-label="Diagram showing three ordinary product decisions, a five-star control, public visibility, and rater weighting, converging into a single outcome: an instrument of social control.">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f7f7f5"/><stop offset="100%" stop-color="#e9ecec"/>
    </linearGradient>
    <style>
      .mn { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; }
      .ui { font-family: Inter, 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif; }
      .lab { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 10.5px; letter-spacing: 1.7px; fill: #8f979b; }
      .ftl { font-size: 17px; font-weight: 600; fill: #14181a; }
      .fds { font-size: 12.5px; fill: #5f676b; }
      .out { font-size: 27px; font-weight: 600; fill: #8f3a42; }
      .ods { font-size: 13.5px; fill: #6d4247; }
    </style>
  </defs>

  <rect width="1600" height="620" fill="url(#cBg)"/>

  <text class="lab" x="80" y="70">ORDINARY IN ISOLATION</text>
  <text class="lab" x="1030" y="70" fill="#8f3a42">COMPOUNDED</text>

  <!-- three ordinary features -->
  <g>
    <rect x="80" y="104" width="430" height="112" rx="6" fill="#fdfdfc" stroke="#d8dcdb"/>
    <g transform="translate(112,142)">
      <g fill="#8f979b">
        <path d="M0,-8 L2.35,-3.24 L7.61,-2.47 L3.8,1.24 L4.7,6.47 L0,4 L-4.7,6.47 L-3.8,1.24 L-7.61,-2.47 L-2.35,-3.24 Z" transform="translate(0,10)"/>
        <path d="M0,-8 L2.35,-3.24 L7.61,-2.47 L3.8,1.24 L4.7,6.47 L0,4 L-4.7,6.47 L-3.8,1.24 L-7.61,-2.47 L-2.35,-3.24 Z" transform="translate(20,10)"/>
        <path d="M0,-8 L2.35,-3.24 L7.61,-2.47 L3.8,1.24 L4.7,6.47 L0,4 L-4.7,6.47 L-3.8,1.24 L-7.61,-2.47 L-2.35,-3.24 Z" transform="translate(40,10)"/>
      </g>
    </g>
    <text class="ui ftl" x="190" y="146">A five-star control</text>
    <text class="ui fds" x="190" y="172">The most common rating pattern on the web.</text>
  </g>

  <g>
    <rect x="80" y="242" width="430" height="112" rx="6" fill="#fdfdfc" stroke="#d8dcdb"/>
    <g transform="translate(112,280)" stroke="#8f979b" stroke-width="1.6" fill="none">
      <circle cx="14" cy="12" r="10"/>
      <path d="M2 34 C2 24, 7 19, 14 19 C21 19, 26 24, 26 34"/>
      <circle cx="42" cy="12" r="6" stroke-opacity="0.5"/>
      <circle cx="60" cy="12" r="6" stroke-opacity="0.35"/>
    </g>
    <text class="ui ftl" x="190" y="284">Visible to everyone</text>
    <text class="ui fds" x="190" y="310">Public profiles are the default across social products.</text>
  </g>

  <g>
    <rect x="80" y="380" width="430" height="112" rx="6" fill="#fdfdfc" stroke="#d8dcdb"/>
    <g transform="translate(112,418)">
      <rect x="0" y="4" width="44" height="7" rx="3.5" fill="#8f979b"/>
      <rect x="0" y="20" width="26" height="7" rx="3.5" fill="#8f979b" fill-opacity="0.55"/>
      <rect x="0" y="36" width="14" height="7" rx="3.5" fill="#8f979b" fill-opacity="0.3"/>
    </g>
    <text class="ui ftl" x="190" y="422">Weighted by reputation</text>
    <text class="ui fds" x="190" y="448">Trust scores weight reviewers on most marketplaces.</text>
  </g>

  <!-- converging lines -->
  <g stroke="#8f3a42" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <path d="M510 160 C640 160, 660 298, 790 298"/>
    <path d="M510 298 L790 298"/>
    <path d="M510 436 C640 436, 660 298, 790 298"/>
  </g>
  <circle cx="790" cy="298" r="5" fill="#8f3a42"/>
  <path d="M812 298 L868 298 M856 288 L868 298 L856 308" stroke="#8f3a42" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- outcome -->
  <g>
    <rect x="900" y="196" width="620" height="204" rx="6" fill="#8f3a42" fill-opacity="0.07" stroke="#8f3a42" stroke-opacity="0.45"/>
    <text class="ui out" x="944" y="268">An instrument of social control</text>
    <line x1="944" y1="292" x2="1476" y2="292" stroke="#8f3a42" stroke-opacity="0.25"/>
    <text class="ui ods" x="944" y="326">Gate life access behind the score, publish every rating,</text>
    <text class="ui ods" x="944" y="350">and let standing decide whose opinion counts.</text>
  </g>

  <line x1="80" y1="540" x2="1520" y2="540" stroke="#d0d4d3"/>
  <text class="ui" x="80" y="582" font-size="15" fill="#5f676b">A review process that evaluates features one at a time will pass all three of these.</text>
</svg>
