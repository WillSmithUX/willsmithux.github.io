<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Cover: an enlarged view of the assistant conversation, showing an intake question, a quick reply, and a meal recommendation card using hand-based portion estimates.">
  <defs>
    <linearGradient id="nuBg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fbfbf9"/><stop offset="100%" stop-color="#e6ecec"/>
    </linearGradient>
    <filter id="nuSh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#14181a" flood-opacity="0.09"/>
    </filter>
    <style>
      .mn { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; }
      .ui { font-family: Inter, 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif; }
      .msg { font-size: 34px; fill: #333a3d; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#nuBg)"/>

  <!-- assistant question -->
  <rect x="90" y="126" width="670" height="172" rx="44" fill="#eef0ee"/>
  <text class="ui msg" x="132" y="196">Long day? Tell me what</text>
  <text class="ui msg" x="132" y="248">you&#8217;re going for tonight.</text>

  <!-- user quick reply -->
  <rect x="772" y="338" width="338" height="102" rx="44" fill="#2f5a63"/>
  <text class="ui" x="941" y="402" text-anchor="middle" font-size="34" fill="#fdfdfc">High protein</text>

  <!-- recommendation card -->
  <g filter="url(#nuSh)">
    <rect x="90" y="486" width="790" height="322" rx="30" fill="#fdfdfc" stroke="#dfe4e3" stroke-width="2"/>
  </g>
  <text class="mn" x="132" y="548" font-size="24" letter-spacing="3.4" font-weight="500" fill="#2f5a63">OPTION 1 OF 3</text>
  <text class="ui" x="132" y="608" font-size="44" font-weight="600" fill="#14181a">Turkey rice bowl</text>
  <line x1="132" y1="640" x2="838" y2="640" stroke="#e2e7e6" stroke-width="2"/>
  <g class="ui" font-size="30" fill="#4a5255">
    <circle cx="146" cy="686" r="9" fill="#2f5a63"/><text x="180" y="696">2-3 palms turkey</text>
    <circle cx="146" cy="742" r="9" fill="#2f5a63"/><text x="180" y="752">1 fist rice, 1 thumb oil</text>
    <circle cx="146" cy="798" r="9" fill="#2f5a63"/><text x="180" y="808">About 45g protein</text>
  </g>
</svg>
