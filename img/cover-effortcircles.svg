<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Cover: concentric sharing model with a private centre, an Inner Circle of four people, an Outer Circle of twenty-three, and a dashed boundary beyond which nobody sees anything.">
  <defs>
    <radialGradient id="ecBg" cx="0.5" cy="0.48" r="0.8">
      <stop offset="0%" stop-color="#f8f9f6"/><stop offset="100%" stop-color="#e5e9e2"/>
    </radialGradient>
    <style>
      .mn { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; }
      .ui { font-family: Inter, 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#ecBg)"/>

  <!-- everyone else -->
  <circle cx="600" cy="445" r="405" fill="none" stroke="#b7bfb5" stroke-width="2" stroke-dasharray="8 10"/>
  <!-- outer circle -->
  <circle cx="600" cy="445" r="312" fill="#41613f" fill-opacity="0.10" stroke="#41613f" stroke-opacity="0.42" stroke-width="2.4"/>
  <!-- inner circle -->
  <circle cx="600" cy="445" r="192" fill="#41613f" fill-opacity="0.21" stroke="#41613f" stroke-opacity="0.75" stroke-width="3"/>

  <!-- outer members -->
  <g fill="#41613f" fill-opacity="0.34">
    <circle cx="858" cy="445" r="12"/><circle cx="782" cy="263" r="12"/>
    <circle cx="600" cy="187" r="12"/><circle cx="418" cy="263" r="12"/>
    <circle cx="342" cy="445" r="12"/><circle cx="418" cy="627" r="12"/>
    <circle cx="600" cy="703" r="12"/><circle cx="782" cy="627" r="12"/>
    <circle cx="838" cy="346" r="12"/><circle cx="362" cy="346" r="12"/>
    <circle cx="362" cy="544" r="12"/><circle cx="838" cy="544" r="12"/>
  </g>

  <!-- inner members -->
  <g class="ui" font-size="21" font-weight="600" fill="#fdfdfc" text-anchor="middle">
    <circle cx="699" cy="346" r="31" fill="#41613f"/><text x="699" y="353">M</text>
    <circle cx="501" cy="346" r="31" fill="#5c7a58"/><text x="501" y="353">D</text>
    <circle cx="501" cy="544" r="31" fill="#7d9778"/><text x="501" y="551">R</text>
    <circle cx="699" cy="544" r="31" fill="#9bb096"/><text x="699" y="551">J</text>
  </g>

  <!-- you -->
  <circle cx="600" cy="445" r="82" fill="#41613f"/>
  <text class="ui" x="600" y="440" text-anchor="middle" font-size="33" font-weight="600" fill="#fdfdfc">You</text>
  <text class="mn" x="600" y="470" text-anchor="middle" font-size="14" letter-spacing="2.4" fill="#bdd0ba">JOURNAL</text>

  <!-- ring labels -->
  <text class="mn" x="600" y="222" text-anchor="middle" font-size="24" letter-spacing="3.6" fill="#2c4429">INNER · 4</text>
  <text class="mn" x="600" y="800" text-anchor="middle" font-size="24" letter-spacing="3.6" fill="#41613f" fill-opacity="0.85">OUTER · 23</text>
  <text class="mn" x="600" y="872" text-anchor="middle" font-size="21" letter-spacing="3.2" fill="#70776e">EVERYONE ELSE · NOTHING</text>
</svg>
