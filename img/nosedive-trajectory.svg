<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" role="img" aria-label="Line chart reconstructing Lacie's rating across the episode, falling from 4.2 to below 1.0. The 4.5 access threshold is marked, and each drop is annotated with the event that caused it.">
  <defs>
    <linearGradient id="tBg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1e252a"/><stop offset="100%" stop-color="#111619"/>
    </linearGradient>
    <linearGradient id="lineG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbe3e5"/>
      <stop offset="45%" stop-color="#c89aa0"/>
      <stop offset="100%" stop-color="#c4626b"/>
    </linearGradient>
    <linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4626b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#c4626b" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mn  { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; }
      .ui  { font-family: Inter, 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif; }
      .ax  { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 11px; fill: #6f7a80; }
      .ev  { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 10.5px; letter-spacing: 1.5px; fill: #8a959b; }
      .val { font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; fill: #dbe3e5; }
      .valR{ font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; fill: #e08a90; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="url(#tBg)"/>

  <text class="mn" x="80" y="66" font-size="11" letter-spacing="2.6" fill="#7f8a90">ONE SCORE, ONE DAY</text>
  <line x1="80" y1="90" x2="1520" y2="90" stroke="#dbe3e5" stroke-opacity="0.12"/>

  <!-- gridlines -->
  <g stroke="#dbe3e5" stroke-opacity="0.07">
    <line x1="160" y1="120" x2="1520" y2="120"/>
    <line x1="160" y1="216" x2="1520" y2="216"/>
    <line x1="160" y1="312" x2="1520" y2="312"/>
    <line x1="160" y1="408" x2="1520" y2="408"/>
    <line x1="160" y1="504" x2="1520" y2="504"/>
  </g>
  <line x1="160" y1="600" x2="1520" y2="600" stroke="#dbe3e5" stroke-opacity="0.22"/>

  <g class="ax" text-anchor="end">
    <text x="140" y="125">5.0</text>
    <text x="140" y="221">4.0</text>
    <text x="140" y="317">3.0</text>
    <text x="140" y="413">2.0</text>
    <text x="140" y="509">1.0</text>
    <text x="140" y="605">0.0</text>
  </g>

  <!-- access threshold -->
  <line x1="160" y1="168" x2="1520" y2="168" stroke="#c4626b" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="6 6"/>
  <rect x="1276" y="146" width="244" height="22" rx="4" fill="#1a1013" fill-opacity="0.85"/>
  <text class="mn" x="1290" y="162" font-size="10" letter-spacing="1.4" fill="#c4626b">4.5 ACCESS THRESHOLD</text>

  <!-- area under line -->
  <path d="M160,196.8 L380,187.2 L600,302.4 L820,331.2 L1040,350.4 L1260,465.6 L1480,542.4 L1480,600 L160,600 Z" fill="url(#areaG)"/>

  <!-- the line -->
  <polyline points="160,196.8 380,187.2 600,302.4 820,331.2 1040,350.4 1260,465.6 1480,542.4"
            fill="none" stroke="url(#lineG)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- points -->
  <g>
    <circle cx="160"  cy="196.8" r="5" fill="#1e252a" stroke="#dbe3e5" stroke-width="2"/>
    <circle cx="380"  cy="187.2" r="5" fill="#1e252a" stroke="#dbe3e5" stroke-width="2"/>
    <circle cx="600"  cy="302.4" r="5" fill="#1e252a" stroke="#c89aa0" stroke-width="2"/>
    <circle cx="820"  cy="331.2" r="5" fill="#1e252a" stroke="#c89aa0" stroke-width="2"/>
    <circle cx="1040" cy="350.4" r="5" fill="#1e252a" stroke="#c89aa0" stroke-width="2"/>
    <circle cx="1260" cy="465.6" r="5" fill="#1e252a" stroke="#c4626b" stroke-width="2"/>
    <circle cx="1480" cy="542.4" r="6.5" fill="#c4626b" stroke="#1e252a" stroke-width="2"/>
  </g>

  <!-- value labels -->
  <g>
    <text class="val"  x="160"  y="176" text-anchor="middle">4.2</text>
    <text class="val"  x="380"  y="166" text-anchor="middle">4.3</text>
    <text class="val"  x="600"  y="282" text-anchor="middle">3.1</text>
    <text class="val"  x="820"  y="311" text-anchor="middle">2.8</text>
    <text class="val"  x="1040" y="330" text-anchor="middle">2.6</text>
    <text class="valR" x="1260" y="445" text-anchor="middle">1.4</text>
    <text class="valR" x="1480" y="522" text-anchor="middle">0.6</text>
  </g>

  <!-- event labels -->
  <g class="ev" text-anchor="middle">
    <text x="160"  y="636">MORNING</text>
    <text x="380"  y="636">COFFEE</text>
    <text x="600"  y="636">AIRPORT</text>
    <text x="820"  y="636">RENTAL</text>
    <text x="1040" y="636">TRUCK</text>
    <text x="1260" y="636" fill="#c4626b">WEDDING</text>
    <text x="1480" y="636" fill="#c4626b">DETAINED</text>
  </g>

  <line x1="80" y1="682" x2="1520" y2="682" stroke="#dbe3e5" stroke-opacity="0.12"/>
  <text class="ui" x="80" y="722" font-size="14.5" fill="#96a2a8">Reconstructed from the episode. Every drop is a stranger&#8217;s tap, and the interface offers no way to contest one.</text>
</svg>
